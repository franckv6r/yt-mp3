name: Release on tag

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag deja cree, ex. v0.4.1"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    uses: ./.github/workflows/build-release.yml
    with:
      tag: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
    secrets: inherit
